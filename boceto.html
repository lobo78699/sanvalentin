<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Link in Bio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajuste para móvil -->
  <style>
    body {
      background: linear-gradient(to bottom, #ffd6e7, #fff);
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 20px;
    }
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto;
      background-image: url("geraldine.jpeg"); /* ruta directa */
      background-size: cover;
      background-position: center;
      border: 4px solid #ff69b4; /* marco rosita */
      box-shadow: 0 0 10px rgba(214, 51, 132, 0.6); /* sombra para resaltar */
    }
    h1 {
      font-size: 1.5em;
      color: #d63384;
      margin-top: 10px;
    }
    .main-text {
      margin: 20px;
      font-style: italic;
      color: #c71585;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 30px;
    }
    .btn {
      padding: 15px;
      border-radius: 25px;
      border: none;
      font-size: 1.2em;
      cursor: pointer;
      background-color: #ffb6c1;
      color: white;
      transition: 0.3s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    .btn img {
      width: 40px; /* logos grandes para móvil */
      height: 40px;
    }
    .btn:hover {
      background-color: #ff69b4;
    }
  </style>
</head>
<body>
  <header>
    <div class="profile-pic"></div>
    <h1>Tu trans favorita ❤️</h1>
  </header>

  <section class="main-text">

    <p><strong>CLICK HERE →</strong></p>
  </section>

  <section class="buttons">
    <a class="btn" href="https://www.instagram.com/regina.franccco?stkn=MWF6OTFoY3RvN3g2cg%3D%3D&utm_source=qr" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram"> Instagram
    </a>
    <a class="btn" href="https://www.tiktok.com/@regina_franccco?_r=1&_t=ZS-99f76wzv3HM" target="_blank">
      <img src="https://img.magnific.com/vector-premium/logotipo-tik-tok_578229-290.jpg?semt=ais_hybrid&w=740&q=80" alt="TikTok"> TikTok
    </a>
    <a class="btn" href="https://x.com/regiannfranco?s=11" target="_blank">
      <img src="https://img.magnific.com/vector-gratis/nuevo-logotipo-twitter-x-2023-sobre-fondo-negro_1017-45423.jpg?semt=ais_hybrid&w=740&q=80" alt="X"> X (Twitter)
    </a>
    <a class="btn" href="https://t.me/Geral23" target="_blank">
      <img src="https://cdn.pixabay.com/photo/2021/12/27/10/50/telegram-6896827_1280.png" alt="Telegram"> Telegram
    </a>
  </section>
</body>
</html>
