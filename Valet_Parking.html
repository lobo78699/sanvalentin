<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checklist Valet Parking</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ffb347,#ffcc33);
    padding: 20px;
}

.container{
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

h1{
    text-align: center;
    color: #ff7300;
    margin-bottom: 30px;
}

.nombre{
    margin-bottom: 25px;
}

input[type="text"]{
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid #ccc;
    font-size: 16px;
}

.lista{
    margin-top: 20px;
}

.item{
    background: #fff3e0;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: 0.3s;
}

.item:hover{
    transform: scale(1.01);
    background: #ffe0b2;
}

.item input{
    transform: scale(1.5);
    cursor: pointer;
}

.item label{
    font-size: 17px;
}

button{
    width: 100%;
    padding: 16px;
    margin-top: 30px;
    border: none;
    border-radius: 14px;
    background: #ff7300;
    color: white;
    font-size: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover{
    background: #e66300;
    transform: scale(1.02);
}

</style>
</head>

<body>

<div class="container">

<h1>🚗 Checklist Valet Parking</h1>

<div class="nombre">
<label><b>Nombre del empleado:</b></label>
<input type="text" id="nombre" placeholder="Escriba su nombre">
</div>

<div class="lista">

<div class="item">
<input type="checkbox" id="1">
<label>Revisar el nivel de agua en los tinacos</label>
</div>

<div class="item">
<input type="checkbox" id="2">
<label>Prender y apagar la bomba de agua si es necesario</label>
</div>

<div class="item">
<input type="checkbox" id="3">
<label>Limpieza del estacionamiento</label>
</div>

<div class="item">
<input type="checkbox" id="4">
<label>Limpieza de entrada del salón y escaleras</label>
</div>

<div class="item">
<input type="checkbox" id="5">
<label>Limpieza de cancelería de entrada al salón</label>
</div>

<div class="item">
<input type="checkbox" id="6">
<label>Boletos de estacionamiento</label>
</div>

<div class="item">
<input type="checkbox" id="7">
<label>Regar el jardín y recoger basura</label>
</div>

<div class="item">
<input type="checkbox" id="8">
<label>Abrir estacionamiento</label>
</div>

<div class="item">
<input type="checkbox" id="9">
<label>Colocar banderines</label>
</div>

<div class="item">
<input type="checkbox" id="10">
<label>Tener listo y cargado su radio</label>
</div>

<div class="item">
<input type="checkbox" id="11">
<label>Utilizar chaleco y banderín</label>
</div>

</div>

<button onclick="generarPDF()">
📄 Generar PDF Profesional
</button>

</div>

<script>

async function generarPDF(){

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    const nombre = document.getElementById("nombre").value || "Sin nombre";

    const actividades = [
        "Revisar el nivel de agua en los tinacos",
        "Prender y apagar la bomba de agua si es necesario",
        "Limpieza del estacionamiento",
        "Limpieza de entrada del salón y escaleras",
        "Limpieza de cancelería de entrada al salón",
        "Boletos de estacionamiento",
        "Regar el jardín y recoger basura",
        "Abrir estacionamiento",
        "Colocar banderines",
        "Tener listo y cargado su radio",
        "Utilizar chaleco y banderín"
    ];

    // ENCABEZADO
    doc.setFillColor(255,115,0);
    doc.rect(0,0,210,30,"F");

    doc.setTextColor(255,255,255);
    doc.setFontSize(22);
    doc.text("CHECKLIST VALET PARKING", 20, 20);

    // DATOS
    doc.setTextColor(0,0,0);

    doc.setFontSize(14);

    doc.text("Empleado:", 20, 45);
    doc.text(nombre, 55, 45);

    const fecha = new Date().toLocaleDateString();

    doc.text("Fecha:", 20, 55);
    doc.text(fecha, 55, 55);

    // TABLA
    let y = 75;

    doc.setFillColor(240,240,240);
    doc.rect(15,y-8,180,10,"F");

    doc.setFontSize(13);
    doc.text("Actividad", 20, y);
    doc.text("Estado", 160, y);

    y += 10;

    actividades.forEach((actividad,index)=>{

        const checked = document.getElementById(index + 1).checked;

        doc.setDrawColor(200);

        doc.rect(15,y-6,180,10);

        doc.setFontSize(11);

        doc.text(actividad,20,y);

        if(checked){

            doc.setTextColor(0,150,0);
            doc.text("REALIZADO ✔",160,y);

        }else{

            doc.setTextColor(200,0,0);
            doc.text("NO REALIZADO ✘",155,y);

        }

        doc.setTextColor(0,0,0);

        y += 12;

    });

    // PIE
    y += 15;

    doc.setFontSize(10);

    doc.text(
        "Documento generado automáticamente por el sistema Oky Doky",
        20,
        y
    );

    doc.save("Checklist_ValetParking.pdf");

}

</script>

</body>
</html>
